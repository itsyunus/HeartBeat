name: Streak Keeper

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  ghost-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get timestamp
        id: timestamp
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "unix=$(date +%s)" >> $GITHUB_OUTPUT
          echo "human=$(date -u +'%A, %B %d, %Y at %I:%M %p UTC')" >> $GITHUB_OUTPUT

      - name: Calculate streak day
        id: streak
        run: |
          START_EPOCH=$(date -d "2026-09-18" +%s)
          NOW_EPOCH=$(date +%s)
          DIFF=$(( (NOW_EPOCH - START_EPOCH) / 86400 ))
          if [ "$DIFF" -lt 1 ]; then DIFF=1; fi
          echo "day=$DIFF" >> $GITHUB_OUTPUT

      - name: Get stats
        id: stats
        run: |
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          echo "total_commits=$TOTAL_COMMITS" >> $GITHUB_OUTPUT

      - name: Pick random message
        id: random
        run: |
          MESSAGES=(
            "chore: daily heartbeat pulse"
            "chore: streak maintenance commit"
            "chore: automated contribution log"
            "chore: ghost commit"
            "chore: phantom push"
            "chore: heartbeat sync"
            "chore: contribution graph feed"
            "chore: still alive still pushing"
            "chore: green square secured"
            "chore: the grind never stops"
            "chore: another day another commit"
            "chore: immortal streak pulse"
            "chore: digital heartbeat"
            "chore: eternity commit"
          )
          QUOTES=(
            "Still here, still pushing."
            "Another day, another commit."
            "The grind never stops."
            "Consistency is key."
            "Streaks are built, not given."
            "Code is temporary. Streaks are forever."
            "Ghost in the machine."
            "The streak lives on."
            "Kept alive by pure discipline."
            "The machine never sleeps."
            "Immortal by design."
            "Not even death can break this streak."
            "Eternal green. Eternal grind."
          )
          MSG_IDX=$((RANDOM % ${#MESSAGES[@]}))
          QUOTE_IDX=$((RANDOM % ${#QUOTES[@]}))
          echo "msg=${MESSAGES[$MSG_IDX]}" >> $GITHUB_OUTPUT
          echo "quote=${QUOTES[$QUOTE_IDX]}" >> $GITHUB_OUTPUT

      - name: Write heartbeat
        run: |
          mkdir -p history
          DATE="${{ steps.timestamp.outputs.date }}"
          cat > HEARTBEAT.json << EOF
          {
            "timestamp": "${{ steps.timestamp.outputs.iso }}",
            "unix": ${{ steps.timestamp.outputs.unix }},
            "date": "${{ steps.timestamp.outputs.human }}",
            "streak_day": ${{ steps.streak.outputs.day }},
            "quote": "${{ steps.random.outputs.quote }}",
            "runner": "github-actions",
            "triggered_by": "${{ github.event_name }}"
          }
          EOF
          sed -i 's/^          //' HEARTBEAT.json

          HISTORY_FILE="history/${DATE}.json"
          if [ -f "$HISTORY_FILE" ]; then
            TMP=$(cat "$HISTORY_FILE")
            echo "$TMP" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          if not isinstance(data,list): data=[data]
          data.append({'timestamp':'${{ steps.timestamp.outputs.iso }}','unix':${{ steps.timestamp.outputs.unix }},'quote':'${{ steps.random.outputs.quote }}'})
          print(json.dumps(data,indent=2))
          " > "$HISTORY_FILE"
          else
            echo '[{"timestamp":"${{ steps.timestamp.outputs.iso }}","unix":${{ steps.timestamp.outputs.unix }},"quote":"${{ steps.random.outputs.quote }}"}]' | python3 -m json.tool > "$HISTORY_FILE"
          fi

      - name: Update README
        run: |
          TOTAL_DAYS=$(ls history/*.json 2>/dev/null | wc -l | tr -d ' ')
          DAY=${{ steps.streak.outputs.day }}
          YEARS=$(( DAY / 365 ))
          REM=$(( DAY % 365 ))
          cat > README.md << 'READMEEOF'
          # HeartBeat

          > An immortal GitHub contribution engine. No human required.

          READMEEOF
          sed -i 's/^          //' README.md
          cat >> README.md << EOF

          | Field | Value |
          |-------|-------|
          | Last Heartbeat | ${{ steps.timestamp.outputs.human }} |
          | Streak Day | Day ${DAY} (~${YEARS}y ${REM}d) |
          | Total Commits | ${{ steps.stats.outputs.total_commits }} |
          | Days Logged | ${TOTAL_DAYS} |
          | Started | September 18, 2026 |
          | Schedule | 4x daily via GitHub Actions |

          > *${{ steps.random.outputs.quote }}*

          ---

          This repo commits to itself automatically via GitHub Actions.
          Zero servers. Zero maintenance. Zero cost. Runs forever.
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "${{ steps.random.outputs.msg }} [day ${{ steps.streak.outputs.day }}]"
            git push || (sleep 5 && git pull --rebase origin main && git push) || (sleep 10 && git pull --rebase origin main && git push)
          fi

      - name: Keep-alive ping
        run: |
          echo "Workflow is alive. Last run: ${{ steps.timestamp.outputs.iso }}"
          echo "This step ensures GitHub does not auto-disable this workflow."
          echo "Any commit pushed by this workflow counts as repo activity."
